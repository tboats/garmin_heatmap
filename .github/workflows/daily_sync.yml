name: Daily Garmin Sync

on:
  schedule:
    # 03:00 UTC = 8:00 PM PDT (Pacific Daylight Time) / 7:00 PM PST
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify Secret Presence
        env:
          TOKEN: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ GARMIN_TOKENS is empty or not injected! Check if it was added under 'Environment secrets' instead of 'Repository secrets'."
          else
            echo "✅ GARMIN_TOKENS is present (length: ${#TOKEN} characters)"
          fi

      - name: Run Garmin Sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python -u sync_garmin.py --auto-push
